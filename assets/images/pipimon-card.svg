<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="slimeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="goldCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Soft Pill -->
  <rect x="10" y="10" width="380" height="300" rx="20" fill="#f0fdfa" stroke="#a7f3d0" stroke-width="2" filter="url(#cardShadow)"/>
  
  <!-- Subtle cyan droplets behind -->
  <circle cx="70" cy="80" r="35" fill="#ccfbf1" opacity="0.6"/>
  <circle cx="110" cy="70" r="45" fill="#ccfbf1" opacity="0.6"/>
  <circle cx="330" cy="240" r="40" fill="#ccfbf1" opacity="0.6"/>

  <!-- Badge Header -->
  <rect x="25" y="24" width="130" height="26" rx="6" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="34" y="41" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#0f766e">BFO SWARM COLONY</text>

  <!-- Title -->
  <text x="25" y="78" font-family="'Fraunces', serif" font-size="22" font-weight="700" fill="#0f172a" font-style="italic">Pipimon</text>
  <text x="25" y="96" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#64748b">The Chemotactic Slime</text>

  <!-- Stat Chips -->
  <g transform="translate(25, 115)">
    <rect width="145" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="8" y="16" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#334155">Peran: Koloni Cerdas (BFO)</text>
    
    <rect y="30" width="145" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="8" y="46" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#334155">Aksi: Tumble &amp; Swim</text>

    <rect y="60" width="145" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="8" y="76" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#334155">Sifat: Membelah (1 &rarr; 2)</text>

    <rect y="90" width="145" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="8" y="106" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#0d9488">Dispersi: P_ed = 0.15</text>
  </g>

  <!-- CHARACTER ARTWORK -->
  <g transform="translate(275, 175)">
    <!-- Shadow -->
    <ellipse cx="0" cy="72" rx="60" ry="15" fill="#0f172a" opacity="0.16"/>

    <!-- Mini Swarm Pipimons in background -->
    <g transform="translate(-55, -45) scale(0.45)">
      <path d="M-30 0 C-30 -35 30 -35 30 0 C30 25 -30 25 -30 0 Z" fill="#22d3ee" opacity="0.8"/>
      <circle cx="-10" cy="-6" r="4" fill="#0f172a"/>
      <circle cx="10" cy="-6" r="4" fill="#0f172a"/>
    </g>
    <g transform="translate(55, -35) scale(0.4)">
      <path d="M-30 0 C-30 -35 30 -35 30 0 C30 25 -30 25 -30 0 Z" fill="#22d3ee" opacity="0.8"/>
      <circle cx="-10" cy="-6" r="4" fill="#0f172a"/>
      <circle cx="10" cy="-6" r="4" fill="#0f172a"/>
    </g>

    <!-- Flagella Tail Waves -->
    <path d="M-35 50 Q -65 65 -75 45 Q -85 25 -105 35" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
    <path d="M-30 58 Q -50 80 -70 75 Q -90 70 -100 85" fill="none" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Main Slime Body (Soft droplet shape) -->
    <path d="M -50 25 C -60 -25 -40 -65 0 -65 C 40 -65 60 -25 50 25 C 45 60 -45 60 -50 25 Z" fill="url(#slimeBody)" filter="url(#glowCyan)"/>

    <!-- Slime Highlight Gloss -->
    <path d="M -25 -45 C -15 -58 10 -58 20 -48 C 22 -46 15 -42 0 -45 C -15 -48 -22 -44 -25 -45 Z" fill="#ffffff" opacity="0.65"/>
    <circle cx="28" cy="-30" r="5" fill="#ffffff" opacity="0.75"/>

    <!-- Golden 5-Point Crown on Head -->
    <g transform="translate(0, -68)">
      <path d="M-22 0 L-26 -16 L-13 -6 L0 -22 L13 -6 L26 -16 L22 0 Z" fill="url(#goldCrown)" stroke="#854d0e" stroke-width="1.2"/>
      <!-- Tiny Ruby in center -->
      <circle cx="0" cy="-6" r="2.5" fill="#ef4444"/>
      <circle cx="-12" cy="-3" r="1.8" fill="#3b82f6"/>
      <circle cx="12" cy="-3" r="1.8" fill="#10b981"/>
    </g>

    <!-- Anime Sparkling Eyes -->
    <g transform="translate(0, -10)">
      <!-- Left Eye -->
      <ellipse cx="-18" cy="0" rx="9" ry="12" fill="#0f172a"/>
      <circle cx="-15" cy="-4" r="4.5" fill="#ffffff"/>
      <circle cx="-20" cy="5" r="2" fill="#ffffff"/>

      <!-- Right Eye -->
      <ellipse cx="18" cy="0" rx="9" ry="12" fill="#0f172a"/>
      <circle cx="21" cy="-4" r="4.5" fill="#ffffff"/>
      <circle cx="16" cy="5" r="2" fill="#ffffff"/>

      <!-- Kawaii Blush Cheeks -->
      <ellipse cx="-30" cy="12" rx="7" ry="4" fill="#f43f5e" opacity="0.55"/>
      <ellipse cx="30" cy="12" rx="7" ry="4" fill="#f43f5e" opacity="0.55"/>

      <!-- Happy Little Mouth -->
      <path d="M-5 10 Q 0 16 5 10" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </g>
</svg>

