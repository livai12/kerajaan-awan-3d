<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <marker id="bfoArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0f766e" />
    </marker>
    <filter id="bfoShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .bfo-title { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
    .bfo-desc  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #475569; }
    .bfo-math  { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: #0f766e; }
    .bfo-badge { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; }
    .bfo-label { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #0f766e; }
  </style>

  <!-- Background Canvas -->
  <rect width="880" height="500" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Badge -->
  <g transform="translate(24, 20)">
    <rect width="415" height="26" rx="6" fill="#ccfbf1" stroke="#5eead4" stroke-width="1.2"/>
    <text x="12" y="17" class="bfo-badge" fill="#0f766e">ALGORITHM FLOW: BACTERIAL FORAGING OPTIMIZATION (BFO)</text>
  </g>

  <!-- STEP 1: CHEMOTAXIS (CYAN) -->
  <g transform="translate(24, 60)">
    <rect width="195" height="410" rx="14" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.6" filter="url(#bfoShadow)"/>
    <rect x="14" y="-10" width="145" height="20" rx="5" fill="#cffafe" stroke="#06b6d4" stroke-width="1"/>
    <text x="24" y="4" class="bfo-badge" fill="#0e7490">1. CHEMOTAXIS (Nc)</text>

    <!-- Tumble -->
    <g transform="translate(12, 25)">
      <rect width="171" height="95" rx="10" fill="#ffffff" stroke="#cffafe" stroke-width="1.2"/>
      <text x="10" y="22" class="bfo-title" fill="#0891b2">Tumble Phase</text>
      <text x="10" y="40" class="bfo-desc">Rotasi acak arah unit &Delta;(i).</text>
      <text x="10" y="58" class="bfo-desc">Menentukan vektor gerak</text>
      <text x="10" y="74" class="bfo-desc">di ruang pencarian solusi.</text>
      <text x="10" y="90" class="bfo-math">&phi; = &Delta;(i) / sqrt(&Delta;^T &Delta;)</text>
    </g>

    <!-- Swim -->
    <g transform="translate(12, 130)">
      <rect width="171" height="95" rx="10" fill="#ffffff" stroke="#cffafe" stroke-width="1.2"/>
      <text x="10" y="22" class="bfo-title" fill="#0891b2">Swim Phase</text>
      <text x="10" y="40" class="bfo-desc">Renang maju sejauh C(i)</text>
      <text x="10" y="58" class="bfo-desc">selama nilai makespan</text>
      <text x="10" y="74" class="bfo-desc">menunjukkan perbaikan.</text>
      <text x="10" y="90" class="bfo-math">&theta;^(i+1) = &theta;^i + C(i)&phi;</text>
    </g>

    <g transform="translate(12, 235)">
      <rect width="171" height="150" rx="10" fill="#ffffff" stroke="#cffafe" stroke-width="1.2"/>
      <text x="10" y="22" class="bfo-title" fill="#0e7490">Perilaku Pipimon:</text>
      <text x="10" y="42" class="bfo-desc">Pipimon memutar tubuhnya</text>
      <text x="10" y="58" class="bfo-desc">di atas pulau, lalu</text>
      <text x="10" y="74" class="bfo-desc">melompat maju cepat</text>
      <text x="10" y="90" class="bfo-desc">mengikuti gradien nutrisi.</text>
      <line x1="10" y1="104" x2="161" y2="104" stroke="#e0f2fe" stroke-width="1"/>
      <text x="10" y="122" class="bfo-desc">Batas Renang: N_s langkah</text>
      <text x="10" y="138" class="bfo-desc">Step Size: C(i) adaptif</text>
    </g>
  </g>

  <!-- ARROW 1 -> 2 -->
  <path d="M 219 250 L 245 250" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#bfoArrow)"/>

  <!-- STEP 2: SWARMING (TEAL) -->
  <g transform="translate(247, 60)">
    <rect width="195" height="410" rx="14" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.6" filter="url(#bfoShadow)"/>
    <rect x="14" y="-10" width="135" height="20" rx="5" fill="#ccfbf1" stroke="#0d9488" stroke-width="1"/>
    <text x="24" y="4" class="bfo-badge" fill="#0f766e">2. SWARMING (Jcc)</text>

    <g transform="translate(12, 25)">
      <rect width="171" height="110" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1.2"/>
      <text x="10" y="22" class="bfo-title" fill="#0f766e">Komunikasi Koloni</text>
      <text x="10" y="40" class="bfo-desc">Fungsi J_cc memodelkan</text>
      <text x="10" y="56" class="bfo-desc">daya tarik antar-bakteri</text>
      <text x="10" y="72" class="bfo-desc">agar koloni tetap padat</text>
      <text x="10" y="88" class="bfo-desc">dan daya tolak agar tidak</text>
      <text x="10" y="104" class="bfo-desc">menumpuk di 1 titik.</text>
    </g>

    <g transform="translate(12, 145)">
      <rect width="171" height="240" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1.2"/>
      <text x="10" y="22" class="bfo-title" fill="#0f766e">Fungsi Sel-ke-Sel:</text>
      <text x="10" y="44" class="bfo-math">J_cc(&theta;) = &sum; J_attract</text>
      <text x="10" y="60" class="bfo-math">         + &sum; J_repel</text>
      
      <line x1="10" y1="75" x2="161" y2="75" stroke="#ccfbf1" stroke-width="1"/>

      <text x="10" y="95" class="bfo-title" font-size="11.5">Efek pada Penjadwalan:</text>
      <text x="10" y="115" class="bfo-desc">Koloni Pipimon menyebar</text>
      <text x="10" y="132" class="bfo-desc">merata di sekitar pulau</text>
      <text x="10" y="148" class="bfo-desc">dengan performa tinggi,</text>
      <text x="10" y="165" class="bfo-desc">mengeksplorasi variasi</text>
      <text x="10" y="182" class="bfo-desc">alokasi tanpa redundansi.</text>
      
      <rect x="8" y="196" width="155" height="34" rx="6" fill="#ccfbf1"/>
      <text x="14" y="212" class="bfo-badge" fill="#0f766e">POPULATION BALANCE</text>
      <text x="14" y="224" class="bfo-desc" font-size="10">Menghindari titik buta</text>
    </g>
  </g>

  <!-- ARROW 2 -> 3 -->
  <path d="M 442 250 L 468 250" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#bfoArrow)"/>

  <!-- STEP 3: REPRODUCTION (PURPLE/PINK) -->
  <g transform="translate(470, 60)">
    <rect width="195" height="410" rx="14" fill="#fdf4ff" stroke="#f0abfc" stroke-width="1.6" filter="url(#bfoShadow)"/>
    <rect x="14" y="-10" width="155" height="20" rx="5" fill="#fae8ff" stroke="#c026d3" stroke-width="1"/>
    <text x="24" y="4" class="bfo-badge" fill="#a21caf">3. REPRODUKSI (Nre)</text>

    <g transform="translate(12, 25)">
      <rect width="171" height="95" rx="10" fill="#ffffff" stroke="#f0abfc" stroke-width="1.2"/>
      <text x="10" y="22" class="bfo-title" fill="#a21caf">Perhitungan Health</text>
      <text x="10" y="40" class="bfo-desc">Akumulasi fitness sepanjang</text>
      <text x="10" y="56" class="bfo-desc">siklus kemotaksis:</text>
      <text x="10" y="78" class="bfo-math">J_health = &sum; Makespan</text>
    </g>

    <!-- Split 1 -> 2 -->
    <g transform="translate(12, 130)">
      <rect width="171" height="110" rx="10" fill="#ffffff" stroke="#f0abfc" stroke-width="1.2"/>
      <text x="10" y="22" class="bfo-title" fill="#a21caf">Pembelahan Sel</text>
      <text x="10" y="40" class="bfo-desc">50% Bakteri Tersehat</text>
      <text x="10" y="56" class="bfo-desc">membelah diri menjadi 2</text>
      <text x="10" y="72" class="bfo-desc">pada koordinat yang sama.</text>
      <text x="10" y="92" class="bfo-math" fill="#a21caf">1 Sehat &rarr; 2 Keturunan</text>
    </g>

    <!-- Elimination -->
    <g transform="translate(12, 250)">
      <rect width="171" height="135" rx="10" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.2"/>
      <text x="10" y="22" class="bfo-title" fill="#be123c">Eliminasi Terlemah</text>
      <text x="10" y="42" class="bfo-desc">50% Bakteri dengan</text>
      <text x="10" y="58" class="bfo-desc">makespan terburuk</text>
      <text x="10" y="74" class="bfo-desc">dieliminasi dari koloni.</text>
      <line x1="10" y1="88" x2="161" y2="88" stroke="#fecdd3" stroke-width="1"/>
      <text x="10" y="106" class="bfo-desc" fill="#be123c">Ukuran Koloni Tetap:</text>
      <text x="10" y="122" class="bfo-math" fill="#be123c">S_total = Konstan</text>
    </g>
  </g>

  <!-- ARROW 3 -> 4 -->
  <path d="M 665 250 L 691 250" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#bfoArrow)"/>

  <!-- STEP 4: DISPERSAL & SPV RULE (ORANGE & GREEN) -->
  <g transform="translate(693, 60)">
    <rect width="165" height="410" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6" filter="url(#bfoShadow)"/>
    <rect x="14" y="-10" width="140" height="20" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
    <text x="24" y="4" class="bfo-badge" fill="#c2410c">4. DISPERSI &amp; SPV</text>

    <!-- Dispersal -->
    <g transform="translate(10, 25)">
      <rect width="145" height="130" rx="10" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2"/>
      <text x="10" y="22" class="bfo-title" fill="#c2410c">Elimination-Dispersal</text>
      <text x="10" y="42" class="bfo-desc">Probabilitas P_ed = 0.15.</text>
      <text x="10" y="60" class="bfo-desc">Bakteri terlempar ke</text>
      <text x="10" y="76" class="bfo-desc">koordinat acak baru.</text>
      <text x="10" y="94" class="bfo-desc">Mencegah perangkap</text>
      <text x="10" y="110" class="bfo-desc">minimum lokal.</text>
    </g>

    <!-- SPV Rule Container -->
    <g transform="translate(10, 165)">
      <rect width="145" height="220" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
      <text x="10" y="22" class="bfo-title" fill="#15803d">SPV Discrete Rule</text>
      <text x="10" y="42" class="bfo-desc">Pemetaan Kontinu ke</text>
      <text x="10" y="58" class="bfo-desc">Indeks Diskrit VM:</text>
      <text x="10" y="80" class="bfo-math" font-size="9.5">VM = floor(|sin(&theta;)|*m)</text>
      <text x="10" y="96" class="bfo-math" font-size="9.5">     + 1</text>
      
      <line x1="10" y1="110" x2="135" y2="110" stroke="#86efac" stroke-width="1"/>

      <text x="10" y="128" class="bfo-desc">Setiap task dialokasikan</text>
      <text x="10" y="144" class="bfo-desc">secara deterministik</text>
      <text x="10" y="160" class="bfo-desc">ke VM 1..m menjaga</text>
      <text x="10" y="176" class="bfo-desc">gradien kemotaksis.</text>
      
      <rect x="8" y="188" width="129" height="24" rx="4" fill="#dcfce7"/>
      <text x="12" y="204" class="bfo-badge" fill="#15803d">IEEE COMPLIANT</text>
    </g>
  </g>
</svg>
