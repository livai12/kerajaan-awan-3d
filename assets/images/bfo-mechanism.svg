<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="100%" height="100%">
  <defs>
    <filter id="cardShadowBFO" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="5" y="5" width="450" height="270" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadowBFO)"/>

  <!-- 4 Step Flow of BFO -->
  <!-- Step 1: Chemotaxis -->
  <g transform="translate(18, 20)">
    <rect width="98" height="240" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
    <rect x="6" y="8" width="86" height="20" rx="5" fill="#ccfbf1"/>
    <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#0f766e">1. Chemotaxis</text>

    <!-- Tumble & Swim visual -->
    <circle cx="49" cy="70" r="16" fill="#06b6d4"/>
    <path d="M 49 54 Q 65 54 65 70" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="2,2"/>
    <text x="35" y="100" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#0e7490">Tumble</text>

    <line x1="49" y1="110" x2="49" y2="155" stroke="#0891b2" stroke-width="2.5"/>
    <polygon points="49,160 45,152 53,152" fill="#0891b2"/>
    <circle cx="49" cy="175" r="16" fill="#0891b2"/>
    <text x="38" y="202" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#0e7490">Swim</text>

    <text x="8" y="225" font-family="'Inter', sans-serif" font-size="9" fill="#475569">Renang searah gradien nutrisi.</text>
  </g>

  <!-- Step 2: Swarming -->
  <g transform="translate(126, 20)">
    <rect width="98" height="240" rx="10" fill="#ecfeff" stroke="#a5f3fc"/>
    <rect x="6" y="8" width="86" height="20" rx="5" fill="#cffafe"/>
    <text x="16" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#0e7490">2. Swarming</text>

    <!-- Swarm cluster -->
    <circle cx="49" cy="90" r="18" fill="#0284c7" opacity="0.9"/>
    <circle cx="30" cy="125" r="13" fill="#38bdf8"/>
    <circle cx="68" cy="125" r="13" fill="#38bdf8"/>
    <circle cx="49" cy="155" r="12" fill="#7dd3fc"/>

    <!-- Attraction rings -->
    <circle cx="49" cy="120" r="42" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="25" y="190" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#0284c7">Atraksi J_cc</text>

    <text x="8" y="225" font-family="'Inter', sans-serif" font-size="9" fill="#475569">Menjaga kepadatan koloni bersama.</text>
  </g>

  <!-- Step 3: Reproduction -->
  <g transform="translate(234, 20)">
    <rect width="98" height="240" rx="10" fill="#fdf4ff" stroke="#f0abfc"/>
    <rect x="6" y="8" width="86" height="20" rx="5" fill="#fae8ff"/>
    <text x="10" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#a21caf">3. Reproduksi</text>

    <!-- 1 divides into 2 -->
    <circle cx="49" cy="65" r="17" fill="#c026d3"/>
    <text x="35" y="70" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Sehat</text>

    <!-- Splitting arrows -->
    <path d="M 40 85 L 30 115" stroke="#a21caf" stroke-width="2"/>
    <path d="M 58 85 L 68 115" stroke="#a21caf" stroke-width="2"/>

    <circle cx="28" cy="135" r="14" fill="#d946ef"/>
    <circle cx="70" cy="135" r="14" fill="#d946ef"/>

    <!-- Dead bacteria marked X -->
    <circle cx="49" cy="180" r="12" fill="#e2e8f0" stroke="#94a3b8"/>
    <line x1="43" y1="174" x2="55" y2="186" stroke="#ef4444" stroke-width="2"/>
    <line x1="55" y1="174" x2="43" y2="186" stroke="#ef4444" stroke-width="2"/>
    <text x="22" y="202" font-family="'Inter', sans-serif" font-size="9" fill="#ef4444">50% Lemah Gugur</text>

    <text x="8" y="225" font-family="'Inter', sans-serif" font-size="9" fill="#475569">Bakteri prima menduplikasi diri.</text>
  </g>

  <!-- Step 4: Dispersal -->
  <g transform="translate(342, 20)">
    <rect width="98" height="240" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
    <rect x="6" y="8" width="86" height="20" rx="5" fill="#ffedd5"/>
    <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#c2410c">4. Dispersi</text>

    <!-- Dispersal scatter -->
    <circle cx="49" cy="80" r="15" fill="#ea580c"/>
    <path d="M 49 100 Q 75 125 80 155" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="3,2"/>
    <polygon points="80,158 74,152 82,150" fill="#ea580c"/>

    <circle cx="80" cy="175" r="12" fill="#f97316"/>
    <text x="20" y="202" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#c2410c">P_ed = 0.15</text>

    <text x="8" y="225" font-family="'Inter', sans-serif" font-size="9" fill="#475569">Mencegah jebakan optimum lokal.</text>
  </g>
</svg>
