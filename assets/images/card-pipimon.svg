<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 280" width="100%" height="100%">
  <defs>
    <linearGradient id="pipCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <linearGradient id="pipSlime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="pipGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="pipGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="380" height="280" rx="16" fill="url(#pipCardBg)" stroke="#99f6e4" stroke-width="2"/>

  <!-- Character Presentation Area (Right side) -->
  <g transform="translate(260, 150)">
    <!-- Shadow -->
    <ellipse cx="0" cy="70" rx="60" ry="14" fill="#0f172a" opacity="0.14"/>

    <!-- Mini helper slimes -->
    <g transform="translate(-50, -40) scale(0.4)">
      <path d="M-30 0 C-30 -35 30 -35 30 0 C30 25 -30 25 -30 0 Z" fill="#22d3ee" opacity="0.85"/>
      <circle cx="-10" cy="-6" r="4" fill="#0f172a"/>
      <circle cx="10" cy="-6" r="4" fill="#0f172a"/>
    </g>
    <g transform="translate(50, -32) scale(0.35)">
      <path d="M-30 0 C-30 -35 30 -35 30 0 C30 25 -30 25 -30 0 Z" fill="#22d3ee" opacity="0.85"/>
      <circle cx="-10" cy="-6" r="4" fill="#0f172a"/>
      <circle cx="10" cy="-6" r="4" fill="#0f172a"/>
    </g>

    <!-- Flagella Waves -->
    <path d="M -32 46 Q -58 60 -68 42 Q -78 24 -96 32" fill="none" stroke="#06b6d4" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M -26 54 Q -45 74 -64 70 Q -82 65 -92 78" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>

    <!-- Main Jelly Body -->
    <path d="M -46 22 C -55 -22 -36 -60 0 -60 C 36 -60 55 -22 46 22 C 40 55 -40 55 -46 22 Z" fill="url(#pipSlime)" filter="url(#pipGlow)"/>

    <!-- Gloss Highlight -->
    <path d="M -22 -42 C -12 -54 10 -54 18 -44 C 20 -42 12 -38 0 -42 C -12 -44 -18 -40 -22 -42 Z" fill="#ffffff" opacity="0.7"/>
    <circle cx="25" cy="-26" r="4.5" fill="#ffffff" opacity="0.8"/>

    <!-- Golden Crown 5-Point -->
    <g transform="translate(0, -62)">
      <path d="M-20 0 L-24 -14 L-12 -5 L0 -20 L12 -5 L24 -14 L20 0 Z" fill="url(#pipGold)" stroke="#854d0e" stroke-width="1"/>
      <circle cx="0" cy="-5" r="2.2" fill="#ef4444"/>
      <circle cx="-11" cy="-3" r="1.6" fill="#3b82f6"/>
      <circle cx="11" cy="-3" r="1.6" fill="#10b981"/>
    </g>

    <!-- Cute Eyes & Cheeks -->
    <g transform="translate(0, -8)">
      <ellipse cx="-16" cy="0" rx="8" ry="11" fill="#0f172a"/>
      <circle cx="-13" cy="-4" r="4" fill="#ffffff"/>
      <circle cx="-18" cy="5" r="1.8" fill="#ffffff"/>

      <ellipse cx="16" cy="0" rx="8" ry="11" fill="#0f172a"/>
      <circle cx="19" cy="-4" r="4" fill="#ffffff"/>
      <circle cx="14" cy="5" r="1.8" fill="#ffffff"/>

      <!-- Blush -->
      <ellipse cx="-26" cy="10" rx="6.5" ry="3.5" fill="#f43f5e" opacity="0.6"/>
      <ellipse cx="26" cy="10" rx="6.5" ry="3.5" fill="#f43f5e" opacity="0.6"/>

      <!-- Mouth -->
      <path d="M -5 8 Q 0 14 5 8" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Information Section (Left side) -->
  <g transform="translate(20, 24)">
    <rect width="130" height="22" rx="5" fill="#ccfbf1" stroke="#0d9488" stroke-width="1"/>
    <text x="10" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#0f766e">MODEL BFO SWARM</text>

    <text x="0" y="52" font-family="'Fraunces', serif" font-size="24" font-weight="700" fill="#0f172a" font-style="italic">Pipimon</text>
    <text x="0" y="70" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#64748b">The Chemotactic Slime</text>

    <!-- Bullet Specs -->
    <g transform="translate(0, 90)">
      <rect width="145" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="8" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#334155">Metode: Swarm Colony</text>

      <rect y="36" width="145" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="8" y="54" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#334155">Aksi: Tumble &amp; Swim</text>

      <rect y="72" width="145" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="8" y="90" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#0d9488">Reproduksi: 1 → 2 Sehat</text>

      <rect y="108" width="145" height="28" rx="6" fill="#ccfbf1" stroke="#5eead4"/>
      <text x="8" y="126" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0f766e">Dispersi: P_ed = 0.15</text>
    </g>
  </g>
</svg>
