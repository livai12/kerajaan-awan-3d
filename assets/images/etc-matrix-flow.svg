<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="100%" height="100%">
  <defs>
    <filter id="etcShad" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="5" y="5" width="450" height="270" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#etcShad)"/>

  <!-- Left: Task Set -->
  <g transform="translate(20, 25)">
    <rect width="105" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="12" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#0f172a">Tasks (T_j)</text>
    <text x="12" y="38" font-family="'Inter', sans-serif" font-size="9" fill="#64748b">Length (MI)</text>

    <!-- Task Items -->
    <rect x="10" y="50" width="85" height="28" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="16" y="68" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#1e40af">t_1: 4500 MI</text>

    <rect x="10" y="86" width="85" height="28" rx="6" fill="#dcfce7" stroke="#86efac"/>
    <text x="16" y="104" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#166534">t_2: 1200 MI</text>

    <rect x="10" y="122" width="85" height="28" rx="6" fill="#fef3c7" stroke="#fde68a"/>
    <text x="16" y="140" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#92400e">t_3: 3100 MI</text>

    <text x="45" y="172" font-family="'JetBrains Mono', monospace" font-size="14" fill="#94a3b8">...</text>

    <rect x="10" y="185" width="85" height="28" rx="6" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="16" y="203" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#5b21b6">t_n: 2000 MI</text>
  </g>

  <!-- Middle: Formula Mapping Card -->
  <g transform="translate(140, 50)">
    <!-- Mapping Arrow -->
    <path d="M 0 60 L 30 60" stroke="#0284c7" stroke-width="3" marker-end="url(#arr)"/>
    <rect x="35" y="20" width="130" height="90" rx="10" fill="#f0f9ff" stroke="#7dd3fc"/>
    <text x="45" y="42" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#0369a1">Matriks ETC</text>
    <rect x="45" y="52" width="110" height="42" rx="6" fill="#ffffff" stroke="#bae6fd"/>
    <text x="52" y="70" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#0f172a">ETC(i,j) =</text>
    <text x="52" y="84" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#0284c7">Length / Speed</text>

    <path d="M 170 60 L 200 60" stroke="#0284c7" stroke-width="3"/>
  </g>

  <!-- Right: VM Islands Load & Makespan -->
  <g transform="translate(345, 25)">
    <rect width="95" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="10" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#0f172a">VM Islands</text>
    <text x="10" y="38" font-family="'Inter', sans-serif" font-size="9" fill="#64748b">Speed (MIPS)</text>

    <!-- VM 1 Bar -->
    <text x="10" y="60" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#334155">VM 1 (300 MIPS)</text>
    <rect x="10" y="66" width="60" height="12" rx="3" fill="#38bdf8"/>
    <text x="74" y="76" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#0369a1">95s</text>

    <!-- VM 2 Bar (Peak = Makespan!) -->
    <text x="10" y="98" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#dc2626">VM 2 (100 MIPS)</text>
    <rect x="10" y="104" width="75" height="14" rx="3" fill="#ef4444"/>
    <text x="10" y="130" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#dc2626">Makespan: 102s</text>

    <!-- VM 3 Bar -->
    <text x="10" y="152" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#334155">VM 3 (200 MIPS)</text>
    <rect x="10" y="158" width="52" height="12" rx="3" fill="#38bdf8"/>
    <text x="66" y="168" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#0369a1">78s</text>

    <!-- Lower Bound Line indicator -->
    <line x1="0" y1="185" x2="95" y2="185" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="10" y="200" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#059669">Lower Bound: 70s</text>
    <text x="10" y="215" font-family="'Inter', sans-serif" font-size="8" fill="#64748b">Optimality Gap: 32s</text>
  </g>
</svg>
