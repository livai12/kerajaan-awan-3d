<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <!-- Background styling -->
    <linearGradient id="reactorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8"/>
    </marker>

    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#f59e0b"/>
    </marker>

    <marker id="arrowWhite" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="920" height="440" rx="16" fill="url(#reactorBg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Title Banner (Eraser.io Header) -->
  <g transform="translate(30, 24)">
    <rect width="250" height="24" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="#0284c7" stroke-width="1"/>
    <text x="12" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">ARSITEKTUR MEMETIC BFO-VNS (POLA D - LRH)</text>
    <text x="0" y="44" font-family="'Fraunces', serif" font-size="20" font-weight="700" fill="#ffffff" font-style="italic">Alur Sinergi Eksplorasi Global Swarm &amp; Eksploitasi Bottleneck Shaking</text>
  </g>

  <!-- ==================== STAGE 1: INPUT WORKLOAD ==================== -->
  <g transform="translate(30, 95)">
    <rect width="180" height="315" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect width="180" height="38" rx="14" fill="#1e293b"/>
    <text x="14" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff">1. Batch Task Masuk</text>

    <!-- Task Packets -->
    <g transform="translate(14, 52)">
      <rect width="152" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="10" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Task T_1 (4500 MI)</text>
      <text x="10" y="34" font-family="'Inter', sans-serif" font-size="9.5" fill="#94a3b8">Beban Komputasi Berat</text>

      <rect y="50" width="152" height="42" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
      <text x="10" y="70" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#c084fc">Task T_2 (1800 MI)</text>
      <text x="10" y="84" font-family="'Inter', sans-serif" font-size="9.5" fill="#94a3b8">Beban Komputasi Menengah</text>

      <rect y="100" width="152" height="42" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
      <text x="10" y="120" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#34d399">Task T_3 (3200 MI)</text>
      <text x="10" y="134" font-family="'Inter', sans-serif" font-size="9.5" fill="#94a3b8">Beban Komputasi Heterogen</text>

      <rect y="150" width="152" height="42" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="10" y="170" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#fbbf24">Task T_n (2400 MI)</text>
      <text x="10" y="184" font-family="'Inter', sans-serif" font-size="9.5" fill="#94a3b8">Tugas Dinamis Cloud</text>

      <rect y="200" width="152" height="48" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="#475569" stroke-width="1"/>
      <text x="10" y="220" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#cbd5e1">Batas Bawah Teoretis</text>
      <text x="10" y="236" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">L_ideal &ge; 103.33s</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 210 250 L 245 250" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan)"/>

  <!-- ==================== STAGE 2: CENTRAL HYBRID CORE ==================== -->
  <g transform="translate(255, 95)">
    <!-- Container Box -->
    <rect width="440" height="315" rx="14" fill="#0b1329" stroke="#0284c7" stroke-width="2"/>
    <rect width="440" height="38" rx="14" fill="rgba(2, 132, 199, 0.25)"/>
    <text x="18" y="24" font-family="'Inter', sans-serif" font-size="12.5" font-weight="800" fill="#ffffff">2. Reaktor Fusi Memetik: Swarm Chemotaxis &amp; Bottleneck Shaking</text>

    <!-- Sub-Block 2A: Pipimon Swarm Chemotaxis (BFO) -->
    <g transform="translate(16, 50)">
      <rect width="195" height="150" rx="10" fill="#042f2e" stroke="#0d9488" stroke-width="1.5"/>
      <text x="10" y="22" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#2dd4bf">🌱 Aero-Pipi (BFO Swarm)</text>

      <g transform="translate(10, 32)">
        <text x="0" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#ccfbf1">• Tumble: Mutasi acak arah &theta;</text>
        <text x="0" y="32" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#ccfbf1">• Swim: Maju bertahap jika makespan turun</text>
        <text x="0" y="50" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#ccfbf1">• Reproduksi: 50% koloni terbaik digandakan</text>
        <text x="0" y="68" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#ccfbf1">• Dispersi (P_ed=0.2): Lolos jebakan lokal</text>
      </g>
      <rect x="10" y="112" width="175" height="26" rx="5" fill="rgba(13, 148, 136, 0.3)" stroke="#2dd4bf" stroke-width="1"/>
      <text x="18" y="129" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#5eead4">Eksplorasi Global Manifold</text>
    </g>

    <!-- Synergy Bridge (Center Arrow) -->
    <g transform="translate(216, 110)">
      <path d="M 0 15 L 18 15" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
      <text x="-4" y="-2" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#fcd34d">Ekstraksi</text>
      <text x="-2" y="32" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#fcd34d">Elit</text>
    </g>

    <!-- Sub-Block 2B: Kocorock Bottleneck VNS Shaking -->
    <g transform="translate(230, 50)">
      <rect width="195" height="150" rx="10" fill="#451a03" stroke="#d97706" stroke-width="1.5"/>
      <text x="10" y="22" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#fcd34d">🗿 Mecha-Kocorock (VNS)</text>

      <g transform="translate(10, 32)">
        <text x="0" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#fef3c7">• Deteksi Bottleneck: Cari VM tersibuk</text>
        <text x="0" y="32" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#fef3c7">• Shaking: Goncang k task dari VM max</text>
        <text x="0" y="50" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#fef3c7">• First-Improvement: Turunkan beban</text>
        <text x="0" y="68" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#fef3c7">• Radius Reset: Jika membaik k &larr; 1</text>
      </g>
      <rect x="10" y="112" width="175" height="26" rx="5" fill="rgba(217, 119, 6, 0.3)" stroke="#fcd34d" stroke-width="1"/>
      <text x="18" y="129" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#fef08a">Eksploitasi Bottleneck Intensif</text>
    </g>

    <!-- Sub-Block 2C: Synergistic Feedback Loop (Bottom) -->
    <g transform="translate(16, 212)">
      <rect width="409" height="88" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="14" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#38bdf8">⚡ Pengendali Paritas Evaluasi (NFE Budget Control = 600 Evaluasi)</text>
      <text x="14" y="38" font-family="'Inter', sans-serif" font-size="10.5" fill="#cbd5e1">Bakteri elit yang diperbaiki oleh Shaking Kocorock dikembalikan ke koloni Pipimon.</text>
      <text x="14" y="54" font-family="'Inter', sans-serif" font-size="10.5" fill="#cbd5e1">Hasil: Konvergensi dipercepat, eliminasi jebakan lokal tercapai, dan standar deviasi ditekan (&plusmn;1.12s).</text>
      <text x="14" y="74" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#fef08a">Rumus Sinergi: Efisiensi (Memetic) &gt; Efisiensi (BFO) + Efisiensi (VNS)</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 695 250 L 730 250" fill="none" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrowCyan)"/>

  <!-- ==================== STAGE 3: OPTIMAL OUTPUT ALLOCATION ==================== -->
  <g transform="translate(735, 95)">
    <rect width="155" height="315" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <rect width="155" height="38" rx="14" fill="rgba(16, 185, 129, 0.25)"/>
    <text x="12" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#ffffff">3. Hasil Terjadwal</text>

    <!-- Result Metrics -->
    <g transform="translate(12, 54)">
      <rect width="131" height="52" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
      <text x="8" y="20" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#a7f3d0">Makespan Terbaik</text>
      <text x="8" y="42" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800" fill="#34d399">104.35s</text>

      <rect y="64" width="131" height="52" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="8" y="84" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#bae6fd">Degree of Imbalance</text>
      <text x="8" y="106" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800" fill="#38bdf8">0.048</text>

      <rect y="128" width="131" height="52" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="8" y="148" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#fde68a">Utilisasi Rata-rata</text>
      <text x="8" y="170" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800" fill="#f59e0b">92.4%</text>

      <rect y="192" width="131" height="54" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.2"/>
      <text x="8" y="210" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#34d399">Uji Signifikansi (p)</text>
      <text x="8" y="232" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#ffffff">p &lt; 0.001 (Sig.)</text>
    </g>
  </g>
</svg>
