<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <marker id="vnsArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1e293b" />
    </marker>
    <filter id="vnsShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .vns-title { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
    .vns-desc  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #475569; }
    .vns-math  { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 600; fill: #b45309; }
    .vns-badge { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; }
    .vns-label { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 700; }
  </style>

  <!-- Background Canvas -->
  <rect width="880" height="500" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Badge -->
  <g transform="translate(24, 20)">
    <rect width="390" height="26" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2"/>
    <text x="12" y="17" class="vns-badge" fill="#b45309">ALGORITHM FLOW: VARIABLE NEIGHBORHOOD SEARCH (VNS)</text>
  </g>

  <!-- START NODE: INITIAL SOLUTION -->
  <g transform="translate(40, 70)">
    <rect width="180" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" filter="url(#vnsShadow)"/>
    <text x="12" y="24" class="vns-title">Solusi Awal (x)</text>
    <text x="12" y="44" class="vns-desc">Heuristik Greedy LPT</text>
  </g>

  <path d="M 220 100 L 260 100" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#vnsArrow)"/>
  <text x="228" y="92" class="vns-label" fill="#475569">k=1</text>

  <!-- CONTAINER 1: SHAKING PHASE (AMBER) -->
  <g transform="translate(265, 60)">
    <rect width="270" height="390" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.6" filter="url(#vnsShadow)"/>
    <rect x="14" y="-10" width="165" height="20" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="24" y="4" class="vns-badge" fill="#b45309">1. SHAKING N_k(x)</text>

    <!-- N1 Card -->
    <g transform="translate(14, 25)">
      <rect width="242" height="72" rx="10" fill="#ffffff" stroke="#fde68a" stroke-width="1.2"/>
      <text x="12" y="22" class="vns-title" fill="#b45309">N_1: Single Task Migration</text>
      <text x="12" y="40" class="vns-desc">Ambil 1 tugas dari VM terberat (max L_i),</text>
      <text x="12" y="58" class="vns-desc">pindahkan ke VM paling ringan (min L_i).</text>
    </g>

    <!-- N2 Card -->
    <g transform="translate(14, 110)">
      <rect width="242" height="72" rx="10" fill="#ffffff" stroke="#fde68a" stroke-width="1.2"/>
      <text x="12" y="22" class="vns-title" fill="#b45309">N_2: Pairwise Task Swap</text>
      <text x="12" y="40" class="vns-desc">Tukar 2 tugas antar dua VM berbeda.</text>
      <text x="12" y="58" class="vns-desc">Menyeimbangkan selisih beban tanpa ubah total.</text>
    </g>

    <!-- N3 Card -->
    <g transform="translate(14, 195)">
      <rect width="242" height="72" rx="10" fill="#ffffff" stroke="#fde68a" stroke-width="1.2"/>
      <text x="12" y="22" class="vns-title" fill="#b45309">N_3: Multi Shaking Perturbation</text>
      <text x="12" y="40" class="vns-desc">Goncang acak k alokasi tugas sekaligus.</text>
      <text x="12" y="58" class="vns-desc">Kocorock melompat &amp; hentak tongkat batu.</text>
    </g>

    <g transform="translate(14, 280)">
      <rect width="242" height="85" rx="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2"/>
      <text x="12" y="22" class="vns-title" fill="#78350f">Tujuan Shaking:</text>
      <text x="12" y="42" class="vns-desc">Menghasilkan solusi acak x' ∈ N_k(x)</text>
      <text x="12" y="60" class="vns-desc">untuk meloloskan pencarian dari</text>
      <text x="12" y="76" class="vns-desc">perangkap optimum lokal (local optima escape).</text>
    </g>
  </g>

  <!-- ARROW FROM SHAKING TO LOCAL SEARCH -->
  <path d="M 535 240 L 575 240" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#vnsArrow)"/>
  <text x="542" y="232" class="vns-label" fill="#475569">x'</text>

  <!-- CONTAINER 2: LOCAL SEARCH & DECISION (LIGHT BLUE & RED/GREEN PATHS) -->
  <g transform="translate(580, 60)">
    <rect width="275" height="390" rx="14" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.6" filter="url(#vnsShadow)"/>
    <rect x="14" y="-10" width="180" height="20" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <text x="24" y="4" class="vns-badge" fill="#0369a1">2. LOCAL SEARCH &amp; ACCEPT</text>

    <!-- Local Search Node -->
    <g transform="translate(14, 25)">
      <rect width="247" height="65" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.2"/>
      <text x="12" y="22" class="vns-title">First-Improvement Descent</text>
      <text x="12" y="40" class="vns-desc">Jelajahi lingkungan N_1(x') hingga</text>
      <text x="12" y="56" class="vns-desc">ditemukan solusi terbaik x''.</text>
    </g>

    <!-- Decision Diamond (Acceptance) -->
    <g transform="translate(137, 160)">
      <polygon points="0,-45 80,0 0,45 -80,0" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
      <text x="-55" y="-6" class="vns-title" font-size="11.5">f(x'') &lt; f(x)?</text>
      <text x="-65" y="12" class="vns-desc" font-size="10">Makespan Turun?</text>
    </g>

    <!-- YES BRANCH: INTENSIFICATION (GREEN) -->
    <path d="M 137 205 L 137 250" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#vnsArrow)"/>
    <text x="145" y="228" class="vns-label" fill="#16a34a">YES (Membaik)</text>

    <g transform="translate(14, 255)">
      <rect width="247" height="60" rx="10" fill="#dcfce7" stroke="#86efac" stroke-width="1.4"/>
      <text x="12" y="22" class="vns-title" fill="#15803d">Terima Solusi (x ← x'')</text>
      <text x="12" y="42" class="vns-math" fill="#166534">Reset Radius: k ← 1 (Intensify)</text>
    </g>

    <!-- NO BRANCH: DIVERSIFICATION (AMBER / RED) -->
    <path d="M 57 160 L 25 160 L 25 345 L 70 345" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#vnsArrow)"/>
    <text x="32" y="152" class="vns-label" fill="#d97706">NO</text>

    <g transform="translate(75, 330)">
      <rect width="186" height="50" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
      <text x="10" y="20" class="vns-title" font-size="11" fill="#9a3412">Perbesar Radius Goncangan:</text>
      <text x="10" y="38" class="vns-math" font-size="10.5">k ← k + 1 (Diversify)</text>
    </g>
  </g>
</svg>
