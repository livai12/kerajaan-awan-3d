<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 280" width="100%" height="100%">
  <defs>
    <!-- Dark Volcanic Magma Background -->
    <linearGradient id="volcanoCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180c06"/>
      <stop offset="50%" stop-color="#2a1208"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Obsidian Basalt Stone Plate -->
    <linearGradient id="obsidianStone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="50%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>

    <!-- Molten Magma / Lava Seam -->
    <linearGradient id="magmaFire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Magma Glow Filter -->
    <filter id="magmaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Lava Ripple Grid Pattern -->
    <pattern id="lavaGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(245, 158, 11, 0.09)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="380" height="280" rx="18" fill="url(#volcanoCardBg)" stroke="#f59e0b" stroke-width="2"/>
  <rect width="380" height="280" rx="18" fill="url(#lavaGrid)"/>

  <!-- Glowing Corner Accents -->
  <path d="M 14 30 L 14 14 L 30 14" fill="none" stroke="#f59e0b" stroke-width="2.5" filter="url(#magmaGlow)"/>
  <path d="M 366 30 L 366 14 L 350 14" fill="none" stroke="#f59e0b" stroke-width="2.5" filter="url(#magmaGlow)"/>
  <path d="M 14 250 L 14 266 L 30 266" fill="none" stroke="#f59e0b" stroke-width="2.5" filter="url(#magmaGlow)"/>
  <path d="M 366 250 L 366 266 L 350 266" fill="none" stroke="#f59e0b" stroke-width="2.5" filter="url(#magmaGlow)"/>

  <!-- Character Presentation: Magma Obsidian Golem (Right Side) -->
  <g transform="translate(262, 145)">
    <!-- Magma Island Platform Rim -->
    <ellipse cx="0" cy="85" rx="58" ry="14" fill="#0c0a09" stroke="#ea580c" stroke-width="2.5" filter="url(#magmaGlow)"/>
    <ellipse cx="0" cy="85" rx="36" ry="8" fill="rgba(245, 158, 11, 0.3)"/>

    <!-- Volcanic Battle Axe (Axe held aloft like Image 3) -->
    <g transform="translate(46, -35)">
      <!-- Axe Handle -->
      <rect x="-3" y="-65" width="7" height="175" rx="3" fill="#292524" stroke="#78350f" stroke-width="1.5"/>
      <line x1="0" y1="-55" x2="0" y2="95" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2" filter="url(#magmaGlow)"/>
      <!-- Double-Headed Volcanic Axe Blade -->
      <path d="M -3 -60 C -18 -75, -28 -55, -24 -40 C -18 -30, -3 -35, -3 -35 Z" fill="url(#obsidianStone)" stroke="#ea580c" stroke-width="1.8" filter="url(#magmaGlow)"/>
      <path d="M 4 -60 C 19 -75, 29 -55, 25 -40 C 19 -30, 4 -35, 4 -35 Z" fill="url(#obsidianStone)" stroke="#ea580c" stroke-width="1.8" filter="url(#magmaGlow)"/>
      <!-- Molten Axe Core -->
      <polygon points="0,-58 6,-48 0,-38 -6,-48" fill="url(#magmaFire)" filter="url(#magmaGlow)"/>
    </g>

    <!-- Golem Legs (Segmented Basalt Plates with Magma Seams) -->
    <g>
      <!-- Left Leg -->
      <polygon points="-34,50 -12,50 -8,82 -36,82" fill="url(#obsidianStone)" stroke="#ea580c" stroke-width="1.8"/>
      <line x1="-28" y1="65" x2="-14" y2="65" stroke="#f59e0b" stroke-width="2" filter="url(#magmaGlow)"/>
      <!-- Right Leg -->
      <polygon points="12,50 34,50 36,82 8,82" fill="url(#obsidianStone)" stroke="#ea580c" stroke-width="1.8"/>
      <line x1="14" y1="65" x2="28" y2="65" stroke="#f59e0b" stroke-width="2" filter="url(#magmaGlow)"/>
    </g>

    <!-- Golem Torso: Segmented Muscle Plates with Magma Cracks (from Image 1) -->
    <g>
      <!-- Base Inner Molten Body -->
      <rect x="-42" y="-24" width="84" height="74" rx="18" fill="url(#magmaFire)" filter="url(#magmaGlow)"/>

      <!-- Pectoral Plates (Chest) -->
      <path d="M -38 -20 L -4 -20 L -6 4 L -36 2 Z" fill="url(#obsidianStone)" stroke="#f59e0b" stroke-width="1.2"/>
      <path d="M 38 -20 L 4 -20 L 6 4 L 36 2 Z" fill="url(#obsidianStone)" stroke="#f59e0b" stroke-width="1.2"/>

      <!-- Glowing Abdominal Pack Plates (Six-pack stone blocks with glowing magma cracks) -->
      <rect x="-24" y="8" width="20" height="12" rx="3" fill="url(#obsidianStone)" stroke="#f59e0b" stroke-width="1.2"/>
      <rect x="4" y="8" width="20" height="12" rx="3" fill="url(#obsidianStone)" stroke="#f59e0b" stroke-width="1.2"/>
      <rect x="-22" y="24" width="18" height="12" rx="3" fill="url(#obsidianStone)" stroke="#f59e0b" stroke-width="1.2"/>
      <rect x="4" y="24" width="18" height="12" rx="3" fill="url(#obsidianStone)" stroke="#f59e0b" stroke-width="1.2"/>

      <!-- Magma Core Belly (Pulsing glowing lava from Image 1) -->
      <ellipse cx="0" cy="42" rx="16" ry="7" fill="url(#magmaFire)" filter="url(#magmaGlow)"/>
    </g>

    <!-- Golem Head (Image 1 Stone Helm with Glowing Slit Eyes) -->
    <g>
      <!-- Head Base -->
      <rect x="-28" y="-68" width="56" height="42" rx="12" fill="url(#obsidianStone)" stroke="#ea580c" stroke-width="1.5"/>
      <!-- Brow Plates -->
      <rect x="-30" y="-66" width="60" height="10" rx="3" fill="#1c1917" stroke="#f59e0b" stroke-width="1"/>
      <!-- Magma Crack lines on Crown -->
      <line x1="-16" y1="-66" x2="-10" y2="-56" stroke="#f59e0b" stroke-width="2" filter="url(#magmaGlow)"/>
      <line x1="16" y1="-66" x2="10" y2="-56" stroke="#f59e0b" stroke-width="2" filter="url(#magmaGlow)"/>

      <!-- Glowing Magma Eyes (Bright Yellow/Orange) -->
      <ellipse cx="-13" cy="-46" rx="7" ry="4.5" fill="#fef08a" filter="url(#magmaGlow)"/>
      <ellipse cx="13" cy="-46" rx="7" ry="4.5" fill="#fef08a" filter="url(#magmaGlow)"/>
      <circle cx="-13" cy="-46" r="2.5" fill="#ffffff"/>
      <circle cx="13" cy="-46" r="2.5" fill="#ffffff"/>

      <!-- Stone Jaw Line -->
      <rect x="-14" y="-35" width="28" height="6" rx="2" fill="#0c0a09" stroke="#f59e0b" stroke-width="1"/>
    </g>

    <!-- Arms (Massive Boulder Shoulders with Magma Seams) -->
    <!-- Left Arm -->
    <g transform="rotate(18 -48 6)">
      <circle cx="-50" cy="-6" r="14" fill="url(#obsidianStone)" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="-56" y="4" width="14" height="32" rx="5" fill="url(#obsidianStone)" stroke="#ea580c" stroke-width="1.2"/>
      <circle cx="-50" cy="38" r="9" fill="url(#obsidianStone)" stroke="#f59e0b" stroke-width="1.5"/>
      <line x1="-54" y1="18" x2="-44" y2="18" stroke="#f59e0b" stroke-width="2" filter="url(#magmaGlow)"/>
    </g>

    <!-- Right Arm (Gripping Battle Axe) -->
    <g transform="rotate(-18 48 6)">
      <circle cx="50" cy="-6" r="14" fill="url(#obsidianStone)" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="42" y="4" width="14" height="32" rx="5" fill="url(#obsidianStone)" stroke="#ea580c" stroke-width="1.2"/>
      <circle cx="50" cy="34" r="9" fill="url(#obsidianStone)" stroke="#f59e0b" stroke-width="1.5"/>
      <line x1="44" y1="18" x2="54" y2="18" stroke="#f59e0b" stroke-width="2" filter="url(#magmaGlow)"/>
    </g>
  </g>

  <!-- Left Information Section -->
  <g transform="translate(22, 22)">
    <!-- Header Chip -->
    <rect width="155" height="22" rx="6" fill="rgba(245, 158, 11, 0.18)" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="8" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#fef08a">HYBRID 1 • VNS SHAKING</text>

    <!-- Character Name -->
    <text x="0" y="52" font-family="'Fraunces', serif" font-size="23" font-weight="700" fill="#ffffff" font-style="italic">Kocorock</text>
    <text x="0" y="70" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#fde68a">The Magma Obsidian Golem</text>

    <!-- Technical Specs Grid -->
    <g transform="translate(0, 88)">
      <rect width="155" height="26" rx="6" fill="rgba(12, 10, 9, 0.75)" stroke="#78350f" stroke-width="1"/>
      <text x="8" y="17" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#fed7aa">Tipe: Magma Trajectory</text>

      <rect y="32" width="155" height="26" rx="6" fill="rgba(12, 10, 9, 0.75)" stroke="#78350f" stroke-width="1"/>
      <text x="8" y="49" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#fed7aa">Senjata: Volcanic Axe</text>

      <rect y="64" width="155" height="26" rx="6" fill="rgba(12, 10, 9, 0.75)" stroke="#78350f" stroke-width="1"/>
      <text x="8" y="81" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#fde68a">Radius: k = 1..3 Relocate</text>

      <rect y="96" width="155" height="26" rx="6" fill="rgba(245, 158, 11, 0.25)" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="8" y="113" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800" fill="#ffffff">Fokus: Bottleneck Relocate</text>
    </g>
  </g>
</svg>
